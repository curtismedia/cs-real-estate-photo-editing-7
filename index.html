<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1917" />

    <!--
      Favicon — generated from the site's own "Cs" logo mark
      (public/images/brand/cs-logo-black.png), cropped to its content and
      centered on a square canvas. See public/favicon/README.md for how to
      regenerate these if the logo ever changes.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />

    <title>Curtis Visuals - Real Estate Post-Production Studio</title>
    <meta
      name="description"
      content="Premium real estate photo and video post-production for photographers, media companies and agencies. HDR, flambient, virtual staging, twilight, drone editing and video."
    />

    <!-- Fonts: Fraunces (editorial display serif) + Archivo (utility sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&display=swap"
      rel="stylesheet"
    />
    <!--
      GITHUB PAGES SPA FALLBACK — decoder half of the 404.html redirect (see
      public/404.html for the full explanation). Must run before React Router
      mounts, so it stays a plain inline script here rather than living in a
      React module. It only does anything when 404.html's redirect produced
      the '?/...' marker; a normal load leaves the URL untouched.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
